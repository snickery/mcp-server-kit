[project]
name = "mcp-server-kit"
version = "0.1.0"
description = "Shared plumbing for FastMCP servers: bearer auth, off-event-loop sync tools with per-call logging, stdio/HTTP serving, and a liveness probe"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nick Engel", email = "nick@engel.au" }]
requires-python = ">=3.12"
keywords = ["mcp", "model-context-protocol", "fastmcp", "server", "auth"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
]
dependencies = [
    # The kit owns the SDK range for every server built on it. <2: mcp 2.0
    # moved FastMCP out of mcp.server.fastmcp; moving to 2.x is a kit release.
    "mcp[cli]>=1.0.0,<2",
    "anyio>=4.0",
    "uvicorn>=0.32.0",
]

[project.urls]
Homepage = "https://github.com/snickery/mcp-server-kit"
Issues = "https://github.com/snickery/mcp-server-kit/issues"

[project.optional-dependencies]
# mcp_server_kit.pdf: native text (pdfplumber), page rasterising (pypdfium2 + pillow),
# OCR through an xberg server over httpx. Imported lazily, only on a PDF call.
pdf = ["pdfplumber>=0.11", "pypdfium2>=4.30", "pillow>=10.0", "httpx>=0.27"]
test = ["pytest>=8.0", "httpx>=0.27.0", "mcp-server-kit[pdf]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
